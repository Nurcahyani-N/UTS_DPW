<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTS DPW | Portofolio Nurcahyani</title>
    <link rel="stylesheets" href="styles/style.css">
    <script src="scripts/script.js" defer></script>
</head>
<body>
    <header class="navbar">
        <a href="#beranda" class="logo">Portofolio Nurcahyani</a>

        <nav aria-label="Navigasi utama">
            <ul class="nav-menu">
                <li><a href="#beranda">Beranda</a></li>
                <li><a href="#tentang">Tentang</a></li>
                <li><a href="#proyek">Proyek</a></li>
                <li><a href="#kontak">Kontak</a></li>
                <li>
                    <button type="button" id="btn-tema" class="btn-tema">

    <main>
        <main>

            <div class="foto-profil">
                <img src="assets/FotoProfile.png" alt="Foto profil saya">
            </div>

            <h1>Hi Hi!!!<br>Saya Nurcahyani</h1>
            <p class="subjudul">Mahasiswa dan Web Developer Pemula</p>

        <section class="section" id="tentang">
            <h2 class="section-title">Tentang Saya</h2>

            <div class="tentang-container">
                <div class="deskripsi">
                    <p>
                        Saya adalah mahasiswi teknik informatika kelas C angkatan 2025 di Universitas Riau
                    </p>
                </div>

                <button
                        type="button"
                        id="btn-selengkapnya"
                        class="btn"
                        aria-expanded="false"
                        aria-controls="detail-tentang"
                    >
                        Selengkapnya
                    </button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>
            &copy; 2026 Nurcahyani | Praktikum DPW
        </p>
    </footer>

</html>
